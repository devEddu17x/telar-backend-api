services:
  api:
    image: nest-api
    build: .
    ports:
      - '${API_PORT:-3000}:3000'
    env_file:
      - .env.local
    environment:
      - DB_HOST=app_db
      - DB_PORT=5432
    # Uncommment for local development with AWS credentials
    volumes:
      - ~/.aws:/home/nestjs/.aws:ro
    networks:
      - app_network
    depends_on:
      - app_db
  app_db:
    image: 'postgres:latest'
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: '${DB_USERNAME:-app_user}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-app_password}'
      POSTGRES_DB: '${DB_NAME:-app_db}'
    ports:
      - '${DB_PORT:-5432}:5432'
    networks:
      - app_network
    restart: 'no'

networks:
  app_network:
    name: textile_app_network
    driver: bridge
