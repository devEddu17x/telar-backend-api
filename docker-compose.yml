services:
  api:
    image: nest-api
    container_name: saas-api
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      - DB_HOST=app_db
      - DB_PORT=5432
    networks:
      - app_network
    depends_on:
      - app_db
  app_db:
    image: 'postgres:latest'
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - 5432:5432
    networks:
      - app_network
    restart: no

  loki:
    image: grafana/loki:3.6.2
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
  grafana:
    image: grafana/grafana:latest
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki

networks:
  app_network:
    driver: bridge
