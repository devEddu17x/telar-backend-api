services:
  test_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: telar_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d telar_test']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: 'no'

  test_s3:
    image: adobe/s3mock:4.10.0
    ports:
      - '9090:9090'
    environment:
      initialBuckets: telar-test-assets
      root: /data
      retainFilesOnExit: 'true'
    restart: 'no'

  test_cognito:
    image: jagregory/cognito-local:5.3.0
    ports:
      - '9229:9229'
    restart: 'no'
