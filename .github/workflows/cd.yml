name: CD

on:
  push:
    branches:
      - develop
      - qa
      - prod
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}

    steps:
      - name: Resolve target
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            ENVIRONMENT="dev"
          elif [ "${{ github.ref }}" = "refs/heads/qa" ]; then
            ENVIRONMENT="qa"
          elif [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            ENVIRONMENT="prod"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENVIRONMENT="prod"
          else
            echo "Unsupported ref: ${{ github.ref }}"
            exit 1
          fi

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.environment }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SSM_PREFIX: ${{ vars.SSM_PREFIX }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment variables
        shell: bash
        run: |
          missing=0

          for name in AWS_REGION AWS_ROLE_ARN SSM_PREFIX; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured for the '${{ needs.resolve-environment.outputs.environment }}' environment"
              missing=1
            fi
          done

          exit "$missing"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read backend parameters
        shell: bash
        run: |
          PARAMETERS_JSON="$(aws ssm get-parameters \
            --with-decryption \
            --names \
              "${SSM_PREFIX}/AWS_REGION" \
              "${SSM_PREFIX}/ECR_REPOSITORY_NAME" \
              "${SSM_PREFIX}/ECR_REPOSITORY_URL" \
              "${SSM_PREFIX}/ECS_CLUSTER_NAME" \
              "${SSM_PREFIX}/ECS_SERVICE_NAME" \
              "${SSM_PREFIX}/ECS_TASK_DEFINITION_ARN" \
            --query "Parameters[].{Name:Name,Value:Value}" \
            --output json)"

          get_parameter() {
            echo "$PARAMETERS_JSON" | jq -r --arg name "${SSM_PREFIX}/$1" '.[] | select(.Name == $name) | .Value'
          }

          for name in AWS_REGION ECR_REPOSITORY_NAME ECR_REPOSITORY_URL ECS_CLUSTER_NAME ECS_SERVICE_NAME ECS_TASK_DEFINITION_ARN; do
            value="$(get_parameter "$name")"

            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/${name}"
              exit 1
            fi

            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      - name: Set image URI
        shell: bash
        run: echo "IMAGE_URI=${ECR_REPOSITORY_URL}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Check image in Amazon ECR
        id: check-image
        shell: bash
        run: |
          set +e
          output="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY_NAME}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --output json 2>&1)"
          status="$?"
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Image already exists in ECR: ${IMAGE_URI}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$output" == *"ImageNotFoundException"* ]]; then
            echo "Image does not exist in ECR yet: ${IMAGE_URI}"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            exit "$status"
          fi

      - name: Log in to Amazon ECR
        if: steps.check-image.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.check-image.outputs.exists != 'true'
        shell: bash
        run: |
          docker build \
            --tag "${IMAGE_URI}" \
            .

          docker push "${IMAGE_URI}"

      - name: Resolve current task definition
        shell: bash
        run: |
          current_task_definition="$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --query "services[0].taskDefinition" \
            --output text)"

          if [ -z "$current_task_definition" ] || [ "$current_task_definition" = "None" ]; then
            current_task_definition="${ECS_TASK_DEFINITION_ARN}"
          fi

          echo "CURRENT_TASK_DEFINITION=${current_task_definition}" >> "$GITHUB_ENV"

      - name: Register new task definition revision
        shell: bash
        run: |
          aws ecs describe-task-definition \
            --task-definition "${CURRENT_TASK_DEFINITION}" \
            --query "taskDefinition" \
            --output json > task-definition.json

          jq --arg image "${IMAGE_URI}" '
            .containerDefinitions |= map(.image = $image)
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task-definition.json > new-task-definition.json

          new_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)"

          echo "NEW_TASK_DEFINITION=${new_task_definition}" >> "$GITHUB_ENV"

      - name: Update ECS service
        shell: bash
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_SERVICE_NAME}" \
            --task-definition "${NEW_TASK_DEFINITION}" \
            --force-new-deployment

      - name: Wait for ECS service stability
        shell: bash
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}"
